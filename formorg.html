<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration Form</title>
    <style>
         body {
            background-color: #fde4e1;
            font-family: Georgia, serif;
        }        

        .container {
            width: 650px;
            margin: 40px auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
        }

        td {
         padding: 10px;
            vertical-align: middle;
        }
           

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select,
        textarea {
            width: 95%;
            padding: 6px;
        }

        textarea {
            height: 80px;

        }

        
        .dob input {
            width: 60px;
        }


        .mobile input {
            width: 80%;
        }

        .btn {
            text-align: center;
            margin-top: 20px;
        }

        input[type="submit"] {
            padding: 6px 20px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Registration Form</h1>

    <form>
        <table>
            <tr>
                <td>Roll no. :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" placeholder="First Name">
                    -
                    <input type="text" placeholder="Last Name">
                </td>
            </tr>

            <tr>
                <td>Father's name :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Date of birth :</td>
                <td class="dob">
                    <input type="text" placeholder="Day"> -
                    <input type="text" placeholder="Month"> -
                    <input type="text" placeholder="Year">
                    (DD-MM-YYYY)
                </td>
            </tr>

            <tr>
                <td>Mobile no. :</td>
                <td class="mobile">
                    +91 -
                    <input type="text">
                </td>
            </tr>

            <tr>
                <td>Email id :</td>
                <td><input type="email"></td>
            </tr>

            <tr>
                <td>Password :</td>
                <td><input type="password"></td>
            </tr>

            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio" name="gender"> Male
                    <input type="radio" name="gender"> Female
                </td>
            </tr>

            <tr>
                <td>Department :</td>
                <td>
                    <input type="checkbox"> CSE
                    <input type="checkbox"> IT
                    <input type="checkbox"> ECE
                    <input type="checkbox"> Civil
                    <input type="checkbox"> Mech
                </td>
            </tr>

            <tr>
                <td>Course :</td>
                <td>
                    <select>
                        <option>-------------- Select Current Course's --------------</option>
                        <option>B.Tech</option>
                        <option>M.Tech</option>
                        <option>BCA</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Student photo :</td>
                <td><input type="file"></td>
            </tr>

            <tr>
                <td>City :</td>
                <td><input type="text"></td>
            </tr>

            <tr>
                <td>Address :</td>
                <td><textarea></textarea></td>
            </tr>
        </table>

        <div class="btn">
            <input type="submit" value="Register">
        </div>
    </form>
</div>

</body>
</html>
